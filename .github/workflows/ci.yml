name: CI

# Dogfoods our own reusable PR title lint, security scans, and Gemini code review
# against this repository on every PR, and serves as a live self-test of all three
# workflows. Uses the local copy on the PR branch (`./`) so changes are validated
# before they're released.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-title-lint:
    uses: ./.github/workflows/pr-title-lint.yml

  security:
    # Only the title changes on an 'edited' event; the diff being scanned is
    # unchanged, so skip re-running the code-scanning jobs on that event.
    if: github.event.action != 'edited'
    uses: ./.github/workflows/security-scans.yml

  gemini-review:
    # Fork PRs can't mint the WIF OIDC token (no id-token access), so the
    # reusable workflow would fail to authenticate rather than just skip.
    # Also skip on 'edited' - only the title changes, not the diff being reviewed.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'edited'
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/gemini-review.yml
