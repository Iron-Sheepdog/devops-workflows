# Reusable: state-aware Terraform drift detection.
#
# Runs `terraform plan` against live infrastructure and notifies ONLY when the
# drift state changes — at most two Slack messages per episode:
#   - "detected"  when drift first appears (and a tracking GitHub issue is opened)
#   - "resolved"  when a later run comes back clean (and the issue is closed)
# While drift persists, runs stay silent (the open issue is the dedup state).
# Every message is tagged with the environment. Reports only; changes nothing.
# DRAFT — review and test before relying on it.
name: terraform-drift

on:
  workflow_call:
    inputs:
      working_directory:
        type: string
        required: true
      environment:
        description: Environment label used in messages and the issue title (e.g. dev)
        type: string
        required: true
      wif_provider:
        type: string
        required: true
      service_account:
        type: string
        required: true
      terraform_version:
        type: string
        default: "1.15.6"
    secrets:
      slack_webhook_url:
        required: true

permissions:
  contents: read
  id-token: write   # WIF
  issues: write     # open/close the drift tracking issue

jobs:
  drift:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ inputs.wif_provider }}
          service_account: ${{ inputs.service_account }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}
          # MUST be false: the default wrapper swallows terraform's real exit
          # code, so `-detailed-exitcode` (2 = drift) came back as 0 and drift
          # detection silently did nothing. With the wrapper off, $? is the true
          # terraform exit code (0 clean / 1 error / 2 drift).
          terraform_wrapper: false

      - name: Init
        run: terraform init -input=false

      - name: Plan (detect drift)
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color -lock-timeout=120s -detailed-exitcode > plan.txt 2>&1
          code=$?
          cat plan.txt
          echo "::notice::terraform plan -detailed-exitcode = $code (0=clean, 2=drift, 1=error)"
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Reconcile tracking issue and notify on change only
        uses: actions/github-script@v7
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.slack_webhook_url }}
          ENVIRONMENT: ${{ inputs.environment }}
          WORKDIR: ${{ inputs.working_directory }}
          EXITCODE: ${{ steps.plan.outputs.exitcode }}
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const env = process.env.ENVIRONMENT;
            const code = process.env.EXITCODE;
            const workdir = process.env.WORKDIR;
            const webhook = process.env.SLACK_WEBHOOK_URL;
            const title = `Terraform drift: ${env}`;
            const { owner, repo } = context.repo;
            const FP_RE = /<!-- drift-fingerprint: ([0-9a-f]+) -->/;

            async function slack(text) {
              if (!webhook) return;
              await fetch(webhook, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text }),
              });
            }

            // Read the plan and derive:
            //  - changed: the sorted list of "# <addr> will be <action>" headers
            //    (the set of drifting resources + their action), and
            //  - fp: a short hash of that set, so we can tell whether the drift is
            //    the SAME drift as an open issue or a genuinely DIFFERENT one.
            function readPlan() {
              let txt = '';
              try { txt = fs.readFileSync(`${workdir}/plan.txt`, 'utf8'); } catch (e) {}
              // Drop the per-resource refresh/read progress lines: they are noisy
              // AND emitted in nondeterministic (concurrent) order, so they must
              // not feed the fingerprint. The rest of the plan renders in a stable
              // order.
              const noise = /: (Refreshing state|Reading\.\.\.|Read complete|Preparing import|Import prepared|Still (reading|refreshing))/;
              const stripped = txt.split('\n').filter(l => !noise.test(l)).join('\n');
              const changed = txt.split('\n')
                .filter(l => / # .* will be /.test(l))
                .map(l => l.trim().replace(/^#\s*/, ''))
                .sort();
              // Fingerprint the changed-resource set. Fall back to the whole
              // noise-stripped plan when there are no "# ... will be ..." headers,
              // so output-only drift (exit code 2, rendered under "Changes to
              // Outputs:") still yields a distinct fingerprint instead of a
              // constant sha1('') that would dedupe distinct episodes.
              const fpInput = changed.length ? changed.join('\n') : stripped;
              const fp = crypto.createHash('sha1').update(fpInput).digest('hex').slice(0, 12);
              // Keep the TAIL when oversized — the "Plan:" summary is the last line.
              let body = stripped;
              if (body.length > 55000) body = '...(truncated)...\n' + body.slice(-55000);
              return { changed, fp, body };
            }

            function issueBody(env, workdir, plan) {
              return [
                `Drift detected in **\`${env}\`** (\`${workdir}\`).`,
                ``,
                `Changed resources (${plan.changed.length}):`,
                plan.changed.length ? plan.changed.map(c => `- \`${c}\``).join('\n') : '_(see plan)_',
                ``,
                `<details><summary>terraform plan</summary>`,
                ``,
                '```',
                plan.body,
                '```',
                `</details>`,
                ``,
                `Resolve by updating the Terraform to match (accept) or \`terraform apply\` to revert (reject). This issue closes automatically when a later run is clean.`,
                ``,
                `<!-- drift-fingerprint: ${plan.fp} -->`,
              ].join('\n');
            }

            // Fail loudly on a hard error OR an unexpected code (so the job can
            // never silently do nothing again). Don't Slack-spam on errors.
            if (code !== '0' && code !== '2') {
              core.setFailed(`drift check for ${env}: unexpected plan exit code "${code}" (expected 0 or 2) — see logs.`);
              return;
            }

            // Find an existing open tracking issue for this environment.
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'drift', per_page: 100,
            });
            const existing = open.data.find(i => i.title === title);

            if (code === '2') {
              const plan = readPlan();
              if (!existing) {
                // New drift episode → open issue + alert.
                const issue = await github.rest.issues.create({
                  owner, repo, title, labels: ['drift'], body: issueBody(env, workdir, plan),
                });
                await slack([
                  `:red_circle: *Infrastructure drift detected — \`${env}\`*`,
                  `Live GCP no longer matches the Terraform code: ${plan.changed.length} resource(s) were changed outside of Terraform (e.g. in the Cloud console).`,
                  `Next step: open the tracking issue and either *accept* the change (update the code in a PR) or *reject* it (run the apply workflow to revert). Nothing was changed automatically.`,
                  issue.data.html_url,
                ].join('\n'));
              } else {
                // An issue is already open. Alert again ONLY if the drift set
                // CHANGED — otherwise stay silent (true dedup on identical drift).
                const prevFp = (existing.body.match(FP_RE) || [])[1];
                if (prevFp !== plan.fp) {
                  await github.rest.issues.update({
                    owner, repo, issue_number: existing.number, body: issueBody(env, workdir, plan),
                  });
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: existing.number,
                    body: `Drift set changed (fingerprint \`${prevFp || 'none'}\` → \`${plan.fp}\`). Now ${plan.changed.length} changed resource(s):\n${plan.changed.map(c => `- \`${c}\``).join('\n')}`,
                  });
                  await slack([
                    `:large_orange_circle: *Infrastructure drift changed — \`${env}\`*`,
                    `The set of resources that differ from the Terraform code has changed — a new or different out-of-band change was detected (now ${plan.changed.length} resource(s)). The existing tracking issue has been updated with details.`,
                    existing.html_url,
                  ].join('\n'));
                }
                // else: same drift still present → silent.
              }
            } else if (code === '0') {
              // Clean. If we were tracking drift, close it and announce resolution.
              if (existing) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: 'Resolved — `terraform plan` is clean again. Closing.',
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: existing.number, state: 'closed',
                });
                await slack([
                  `:white_check_mark: *Infrastructure drift resolved — \`${env}\`*`,
                  `Live GCP matches the Terraform code again — the difference was reverted or accepted into code. The tracking issue has been closed automatically.`,
                ].join('\n'));
              }
            }
