name: Release Please

# Automates SemVer releases from Conventional Commits.
#
# On every push to `main`, release-please maintains a "release PR" that
# accumulates pending changes and previews the next version + CHANGELOG.
# Merging that PR creates the GitHub release and an immutable tag (e.g.
# `v1.2.3`). The `tag-major-alias` job then force-moves the matching major
# tag (`v1`) to the released commit so consumers pinned to `@v1` pick it up.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      major: ${{ steps.release.outputs.major }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Re-point the moving major tag (e.g. v1) at the freshly released commit so
  # callers using `@v1` receive non-breaking updates automatically.
  tag-major-alias:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move major version tag
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          MAJOR: ${{ needs.release-please.outputs.major }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "v${MAJOR}" "${TAG_NAME}"
          git push origin "v${MAJOR}" --force