name: Gemini Code Review (Reusable)

# Reusable workflow: call this from another repo/workflow via `uses:`. It runs
# an automated code review on the pull request using the official
# google-github-actions/run-gemini-cli action and the Gemini CLI code-review
# extension, posting inline review comments. Authenticates to Vertex AI
# keylessly via Workload Identity Federation - the calling job just needs
# `permissions: id-token: write`.
#
# Adapted from the official example:
# https://github.com/google-github-actions/run-gemini-cli/tree/main/examples/workflows/pr-review
on:
  workflow_call:
    inputs:
      additional_context:
        type: string
        description: Any additional instructions or context for the review.
        required: false
      gemini_model:
        type: string
        description: Gemini model to use for the review.
        required: false
        default: gemini-3.5-flash
      upload_artifacts:
        type: boolean
        description: Upload the Gemini CLI's stdout/stderr/telemetry logs as a workflow artifact for diagnostics.
        required: false
        default: false
      gemini_debug:
        type: boolean
        description: Enable Gemini CLI debug logging and stream responses to the job log. May expose sensitive content; use only for diagnosing issues.
        required: false
        default: false
      max_session_turns:
        type: number
        description:
          Maximum number of Gemini CLI session turns before the review aborts with FatalTurnLimitedError. Raise when reviews routinely exhaust the default cap (e.g. larger diffs, retried MCP tool
          calls).
        required: false
        default: 100
      timeout_minutes:
        type: number
        description:
          Wall-clock minutes before the review job is cancelled. The job cost scales with the PR's existing comment/thread history (the standing thread-aware-dedup rules require fetching all threads,
          including resolved ones, via the GitHub MCP server before posting), so long-lived PRs with several review rounds may need more than the default.
        required: false
        default: 10
      gcp_project_id:
        type: string
        description:
          GCP project the review authenticates against via Workload Identity Federation. Use `iron-sheepdog-dev` for engineering R&D repos or `isd-ai-innovation` for internal OpEx/analyst repos.
        required: false
        default: iron-sheepdog-dev
      gcp_location:
        type: string
        description: GCP region for Vertex AI inference.
        required: false
        default: global
      gcp_workload_identity_provider:
        type: string
        description:
          The full resource name of the GCP Workload Identity Provider. Resolution order - this input, then the caller's `VERTEX_WIF_PROVIDER` repository/organization variable (GitHub Free doesn't
          propagate org variables to private repos), then the shared Iron-Sheepdog WIF pool baked into this workflow.
        required: false
      gcp_service_account:
        type: string
        description:
          The GCP service account email to impersonate. Resolution order - this input, then the caller's `VERTEX_REVIEW_SA` repository/organization variable (GitHub Free doesn't propagate org
          variables to private repos), then the shared gemini-review service account baked into this workflow.
        required: false

concurrency:
  group: '${{ github.workflow }}-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}'
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  gemini-review:
    name: Gemini Code Review
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # ratchet:actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare prompt context
        run: |-
          mkdir -p .gemini

          # Standing rules appended to every review. The process rules make review
          # rounds converge instead of re-reviewing the whole PR from scratch each
          # push (https://github.com/Iron-Sheepdog/devops-workflows/issues/22). The
          # budget rules keep large PRs inside max_session_turns: without them the
          # model spends its turns on calls that can only fail in this job (shell,
          # node_modules, .env) or on paging through a diff it already has.
          # Every rule must be doable with the tools enabled in the settings below.
          STANDING_INSTRUCTIONS=$(cat <<'GEMINI_RULES_EOF'
          Follow these rules on every run, in addition to the usual code review.

          Budget:

          - You have at most __MAX_SESSION_TURNS__ model turns for the whole review. A turn can hold several tool calls, so make independent calls together (for example, read several files at once) instead of one per turn.
          - Call `pull_request_read` with method `get_diff` once. The whole diff comes back in that one response; don't fetch it again or page through a saved copy of it.
          - Create the pending review as soon as you have read the diff and the existing threads, add each inline comment as soon as you have settled on it, and leave yourself turns to submit the review. If the run is cut off, only comments already added to the pending review are kept.
          - Read other repository files only when a finding depends on code outside the diff.
          - Dependencies are not installed, so `node_modules` does not exist. Don't search or read it; judge library usage from the diff and the repository's own code.
          - Reads of `.env` files and of paths outside the repository are blocked. A changed `.env` file is already in the diff.
          - This job has no shell and no web access. The only GitHub tools are `pull_request_read`, `pull_request_review_write` and `add_comment_to_pending_review`.

          Review process:

          1. Thread-aware dedup: before adding inline comments, fetch the existing review threads once with `pull_request_read` method `get_review_comments`; the result includes resolved threads. Never add a comment that duplicates an existing thread. You can't reply on an existing thread from this job, so if you want to re-raise a point from a resolved or declined thread with new evidence, say so in the summary and name the file and line instead of opening a new thread.
          2. Summary marker: the review summary (the body you submit the review with) must start with the exact marker line `<!-- gemini-review-summary -->` on its own line. Earlier summaries can't be edited from this job, so don't look for them.
          3. Severity floor for inline threads: only open inline review threads for MEDIUM severity and above. Roll LOW-severity observations into the summary as a bullet list instead of inline threads.
          4. Convergence rule: if the existing threads show the latest changes only address earlier review feedback and all of those threads are resolved, don't hunt for new nits; submit a short summary that ends in "LGTM :+1:".

          When the diff has no issues worth raising as inline comments, end the summary with a final line that reads exactly "LGTM :+1:".
          GEMINI_RULES_EOF
          )
          STANDING_INSTRUCTIONS="${STANDING_INSTRUCTIONS//__MAX_SESSION_TURNS__/${MAX_SESSION_TURNS}}"

          if [ -n "${ADDITIONAL_CONTEXT}" ]; then
            REVIEW_CONTEXT=$(printf "%s\n\n%s" "${ADDITIONAL_CONTEXT}" "${STANDING_INSTRUCTIONS}")
          else
            REVIEW_CONTEXT="${STANDING_INSTRUCTIONS}"
          fi

          {
            echo 'REVIEW_CONTEXT<<GEMINI_CONTEXT_EOF'
            printf '%s\n' "${REVIEW_CONTEXT}"
            echo 'GEMINI_CONTEXT_EOF'
          } >> "${GITHUB_ENV}"

          jq -n \
            --arg repo "${REPOSITORY}" \
            --arg pr "${PULL_REQUEST_NUMBER}" \
            --arg context "${REVIEW_CONTEXT}" \
            '{repository: $repo, pull_request_number: $pr, additional_context: $context}' > .gemini/context.json
        env:
          REPOSITORY: '${{ github.repository }}'
          PULL_REQUEST_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          ADDITIONAL_CONTEXT: '${{ inputs.additional_context }}'
          MAX_SESSION_TURNS: '${{ inputs.max_session_turns }}'

      - name: Run Gemini pull request review
        uses: google-github-actions/run-gemini-cli@v0 # ratchet:exclude
        id: gemini_pr_review
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN || github.token }}'
          REPOSITORY: '${{ github.repository }}'
          PULL_REQUEST_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          ADDITIONAL_CONTEXT: '${{ env.REVIEW_CONTEXT }}'
        with:
          use_vertex_ai: true
          gcp_project_id: '${{ inputs.gcp_project_id }}'
          gcp_location: '${{ inputs.gcp_location }}'
          gcp_workload_identity_provider:
            "${{ inputs.gcp_workload_identity_provider || vars.VERTEX_WIF_PROVIDER || 'projects/1094991255833/locations/global/workloadIdentityPools/github-actions-shared/providers/github' }}"
          gcp_service_account: "${{ inputs.gcp_service_account || vars.VERTEX_REVIEW_SA || 'gemini-review@iron-sheepdog-dev.iam.gserviceaccount.com' }}"
          gemini_model: '${{ inputs.gemini_model }}'
          gemini_debug: '${{ inputs.gemini_debug }}'
          upload_artifacts: '${{ inputs.upload_artifacts }}'
          workflow_name: gemini-review
          github_pr_number: '${{ github.event.pull_request.number }}'
          # Tool settings, which keep large PRs inside max_session_turns:
          # - tools.exclude: the shell is denied by policy in this job anyway, and
          #   a reviewer has no use for web access or file writes. Excluded tools
          #   aren't offered to the model, so it doesn't spend turns trying them.
          # - truncateToolOutputThreshold (default 40,000 chars): above it, an MCP
          #   result is cut to its first 20% and last 80% and the rest saved to a
          #   temp file, so a large get_diff arrived mostly missing and the model
          #   paged through the file with read_file. 400,000 chars (~100k tokens)
          #   returns the whole diff of any reasonably sized PR in one call.
          # - outputMasking.protectionThresholdTokens (default 50,000 tokens):
          #   older tool results beyond that budget are replaced with a stub, which
          #   masked a large diff one turn after it was read. 150,000 keeps a full
          #   diff in context alongside the files read after it.
          # - includeTools: only the GitHub MCP tools the review uses (as in the
          #   upstream pr-review example), instead of ~40 including write tools.
          settings: |-
            {
              "model": {
                "maxSessionTurns": ${{ inputs.max_session_turns }}
              },
              "tools": {
                "exclude": [
                  "run_shell_command",
                  "web_fetch",
                  "google_web_search",
                  "write_file",
                  "replace"
                ],
                "truncateToolOutputThreshold": 400000
              },
              "contextManagement": {
                "tools": {
                  "outputMasking": {
                    "protectionThresholdTokens": 150000
                  }
                }
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.27.0"
                  ],
                  "includeTools": [
                    "pull_request_read",
                    "pull_request_review_write",
                    "add_comment_to_pending_review"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              },
              "context": {
                "fileName": ["AGENTS.md", "GEMINI.md"]
              }
            }
          extensions: |
            [
              "https://github.com/gemini-cli-extensions/code-review"
            ]
          prompt: '/pr-code-review https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number || github.event.issue.number }}'

      # The code-review extension adds inline comments to a pending review and
      # submits it only at the end, so a run that stops early (for example with
      # FatalTurnLimitedError) used to leave every drafted comment unpublished.
      # Submit what it drafted, marked as partial. The job still fails.
      - name: Submit partial review
        if: failure() && steps.gemini_pr_review.outcome == 'failure'
        run: |-
          reviews_path="repos/${REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}/reviews"

          # A pending review is visible only to its author, which is this token.
          review_id=$(gh api --paginate "${reviews_path}" \
            --jq '.[] | select(.state == "PENDING" and .user.login == "github-actions[bot]") | .id' | awk 'NR == 1')
          if [ -z "${review_id}" ]; then
            echo "No pending review to submit."
            exit 0
          fi

          comment_count=$(gh api --paginate "${reviews_path}/${review_id}/comments" --jq '.[].id' | wc -l)
          if [ "${comment_count}" -eq 0 ]; then
            gh api -X DELETE "${reviews_path}/${review_id}" > /dev/null
            echo "Deleted an empty pending review."
            exit 0
          fi

          body=$(printf '%s\n%s\n\n%s\n' \
            '<!-- gemini-review-summary -->' \
            '## 📋 Review Summary (partial)' \
            "The Gemini review stopped before it finished ([run log](${RUN_URL})). It had drafted the ${comment_count} inline comment(s) below; files it hadn't reached were not reviewed.")
          gh api -X POST "${reviews_path}/${review_id}/events" -f event=COMMENT -f body="${body}" > /dev/null
          echo "Submitted a partial review with ${comment_count} inline comment(s)."
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN || github.token }}'
          REPOSITORY: '${{ github.repository }}'
          PULL_REQUEST_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          RUN_URL: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
