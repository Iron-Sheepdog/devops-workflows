name: Gemini Code Review (Reusable)

# Reusable workflow: call this from another repo/workflow via `uses:` and
# `jobs.<id>.secrets`. It runs an automated code review on the pull request
# using the official google-github-actions/run-gemini-cli action and the
# Gemini CLI code-review extension, posting inline review comments.
#
# Adapted from the official example:
# https://github.com/google-github-actions/run-gemini-cli/tree/main/examples/workflows/pr-review
on:
  workflow_call:
    inputs:
      additional_context:
        type: string
        description: Any additional instructions or context for the review.
        required: false
      gemini_model:
        type: string
        description: Gemini model to use for the review.
        required: false
        default: gemini-3.5-flash
      upload_artifacts:
        type: boolean
        description: Upload the Gemini CLI's stdout/stderr/telemetry logs as a workflow artifact for diagnostics.
        required: false
        default: false
      gemini_debug:
        type: boolean
        description: Enable Gemini CLI debug logging and stream responses to the job log. May expose sensitive content; use only for diagnosing issues.
        required: false
        default: false
      max_session_turns:
        type: number
        description:
          Maximum number of Gemini CLI session turns before the review aborts with FatalTurnLimitedError. Raise when reviews routinely exhaust the default cap (e.g. larger diffs, retried MCP tool
          calls).
        required: false
        default: 100
    secrets:
      GEMINI_API_KEY:
        description: API key for the Gemini API, used to authenticate the review action.
        required: true

concurrency:
  group: '${{ github.workflow }}-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}'
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  gemini-review:
    name: Gemini Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # ratchet:actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare prompt context
        run: |-
          mkdir -p .gemini

          # Standing process rules appended to every review, so review rounds
          # converge instead of re-reviewing the whole PR from scratch each push.
          # See https://github.com/Iron-Sheepdog/devops-workflows/issues/22.
          STANDING_INSTRUCTIONS=$'Follow these review-process rules on every run, in addition to the usual code review:\n\n1. Thread-aware dedup: before posting any inline comment, fetch the PR\'s existing review threads via the GitHub MCP server, including resolved ones. Never re-post a suggestion that duplicates an existing thread. If you want to re-raise a point from a resolved or declined thread with new evidence, reply on that existing thread instead of opening a new one.\n2. Single evolving summary: your summary comment must start with the exact marker line `<!-- gemini-review-summary -->` on its own line. Before posting, check whether a PR issue comment already contains this marker. If one exists, update that comment in place instead of posting a new comment.\n3. Severity floor for inline threads: only open inline review threads for MEDIUM severity and above. Roll LOW-severity observations into the summary comment as a bullet list instead of inline threads.\n4. Convergence rule: if the diff since the last reviewed commit only addresses prior review feedback and all previous threads are resolved, do not hunt for new nits - update the summary comment to end in "LGTM :+1:" instead.\n\nWhen the diff has no issues worth raising as inline comments, end the summary comment with a final line that reads exactly "LGTM :+1:".'

          if [ -n "${ADDITIONAL_CONTEXT}" ]; then
            REVIEW_CONTEXT=$(printf "%s\n\n%s" "${ADDITIONAL_CONTEXT}" "${STANDING_INSTRUCTIONS}")
          else
            REVIEW_CONTEXT="${STANDING_INSTRUCTIONS}"
          fi

          {
            echo 'REVIEW_CONTEXT<<GEMINI_CONTEXT_EOF'
            printf '%s\n' "${REVIEW_CONTEXT}"
            echo 'GEMINI_CONTEXT_EOF'
          } >> "${GITHUB_ENV}"

          jq -n \
            --arg repo "${REPOSITORY}" \
            --arg pr "${PULL_REQUEST_NUMBER}" \
            --arg context "${REVIEW_CONTEXT}" \
            '{repository: $repo, pull_request_number: $pr, additional_context: $context}' > .gemini/context.json
        env:
          REPOSITORY: '${{ github.repository }}'
          PULL_REQUEST_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          ADDITIONAL_CONTEXT: '${{ inputs.additional_context }}'

      - name: Run Gemini pull request review
        uses: google-github-actions/run-gemini-cli@v0 # ratchet:exclude
        id: gemini_pr_review
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN || github.token }}'
          GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'
          REPOSITORY: '${{ github.repository }}'
          PULL_REQUEST_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          ADDITIONAL_CONTEXT: '${{ env.REVIEW_CONTEXT }}'
        with:
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          gemini_model: '${{ inputs.gemini_model }}'
          gemini_debug: '${{ inputs.gemini_debug }}'
          upload_artifacts: '${{ inputs.upload_artifacts }}'
          workflow_name: gemini-review
          github_pr_number: '${{ github.event.pull_request.number }}'
          settings: |-
            {
              "model": {
                "maxSessionTurns": ${{ inputs.max_session_turns }}
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.27.0"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              },
              "context": {
                "fileName": ["AGENTS.md", "GEMINI.md"]
              }
            }
          extensions: |
            [
              "https://github.com/gemini-cli-extensions/code-review"
            ]
          prompt: '/pr-code-review https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number || github.event.issue.number }}'
