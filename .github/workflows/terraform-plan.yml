# Reusable: terraform plan for pull requests. Authenticates to GCP keylessly via
# Workload Identity Federation (no stored key), runs `terraform plan`, and
# optionally comments the plan on the PR. (Drift detection lives in
# terraform-drift.yml.)
# DRAFT — review and test before relying on it.
name: terraform-plan

on:
  workflow_call:
    inputs:
      working_directory:
        description: Directory to run Terraform in (e.g. envs/dev)
        type: string
        required: true
      wif_provider:
        description: Workload Identity provider resource name
        type: string
        required: true
      service_account:
        description: Service account email to impersonate
        type: string
        required: true
      terraform_version:
        type: string
        default: "1.15.6"
      comment_on_pr:
        type: boolean
        default: true
      label:
        description: Short env label for the plan artifact (e.g. dev, staging). Used by callers that aggregate multiple envs into one comment.
        type: string
        default: plan

permissions:
  contents: read
  id-token: write        # required for WIF OIDC token
  pull-requests: write   # required to comment the plan

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ inputs.wif_provider }}
          service_account: ${{ inputs.service_account }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}
          # Off so $? is terraform's true exit code (the default wrapper masks it,
          # which would let a real plan error look like success).
          terraform_wrapper: false

      - name: Init
        run: terraform init -input=false

      - name: Plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color -lock-timeout=120s -detailed-exitcode > plan.txt 2>&1
          code=$?
          cat plan.txt
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          # Filtered copy for the PR comment: drop the noisy per-resource
          # refresh/read/import progress lines so the actual diff + "Plan:"
          # summary are what a reviewer sees. Full output stays in plan.txt (above).
          grep -vE ': (Refreshing state|Reading\.\.\.|Read complete|Preparing import|Import prepared|Still (reading|refreshing))' plan.txt > plan-comment.txt || true
          # detailed-exitcode: 0=no changes, 2=changes, 1=error
          [ "$code" = "1" ] && exit 1 || exit 0

      # Publish the filtered plan so a caller can assemble one combined,
      # multi-environment comment (fixed order, collapsible sections). Callers
      # that aggregate set comment_on_pr=false and read these artifacts instead.
      - name: Upload plan artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.label }}
          path: ${{ inputs.working_directory }}/plan-comment.txt
          if-no-files-found: ignore
          retention-days: 5

      - name: Comment plan on PR
        if: ${{ inputs.comment_on_pr && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = fs.readFileSync('${{ inputs.working_directory }}/plan-comment.txt', 'utf8');
            // Keep the TAIL if oversized — the "Plan:" summary is at the end.
            if (body.length > 60000) body = '...(truncated)...\n' + body.slice(-60000);
            // Hidden marker keyed on the working directory. Re-runs UPDATE the same
            // comment instead of appending a new one on every push, and each env
            // (working directory) that calls this workflow gets its own comment.
            const marker = '<!-- tf-plan:${{ inputs.working_directory }} -->';
            const commentBody = marker + '\n#### `terraform plan` — `${{ inputs.working_directory }}`\n```\n' + body + '\n```';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
            }
