name: Deterministic Security Scans (Reusable)

# Reusable workflow: call this from another repo/workflow via `uses:`. It runs two
# deterministic security baselines in parallel against the caller's checked-out code:
#
#   * Gitleaks — scans git history for hardcoded secrets (API keys, tokens).
#   * Trivy    — scans the filesystem (dependency manifests, etc.) for known CVEs.
#
# These complement the non-deterministic Gemini review (gemini-review.yml): hard,
# repeatable checks for problems LLMs are unreliable at (exact secret/CVE matching).
#
# Notes:
#   * We run the Gitleaks *CLI binary* (MIT, free) rather than gitleaks/gitleaks-action,
#     because that action requires a paid license to scan repos owned by an organization.
#   * On a pull_request event Gitleaks scans only the commits the PR adds. Re-scanning the
#     whole history on every PR costs minutes on a large repo (8m24s over 30,764 commits in
#     react-app, against a 10-minute timeout) to re-prove a fact about commits the PR never
#     touched — and a hit on an old commit blocks an author who cannot fix it anyway, since
#     remediation means rotating the credential and rewriting history. Full-history scanning
#     still has value (newer Gitleaks rules catch secrets older versions missed), so it stays
#     the default for every non-PR event and is available on PRs via `gitleaks_full_history`.
#   * The Trivy action is pinned to a full commit SHA — trivy-action has been the target
#     of supply-chain attacks via mutable tags, so `@master`/`@vX` are unsafe.
on:
  workflow_call:
    inputs:
      node_version:
        type: string
        description: Node version used for environment context (informational).
        required: false
        default: '22.x'
      severity:
        type: string
        description: Comma-separated Trivy severities to report (e.g. "CRITICAL,HIGH").
        required: false
        default: 'CRITICAL,HIGH'
      trivy_exit_code:
        type: string
        description: 'Exit code when Trivy finds vulnerabilities. "0" = report-only (default), "1" = fail the build.'
        required: false
        default: '0'
      gitleaks_exit_code:
        type: string
        description: 'Exit code when Gitleaks finds secrets. "1" = fail the build (default), "0" = report-only.'
        required: false
        default: '1'
      scan_ref:
        type: string
        description: Filesystem path Trivy scans for vulnerabilities.
        required: false
        default: '.'
      run_gitleaks:
        type: boolean
        description: Run the Gitleaks secret-detection job.
        required: false
        default: true
      gitleaks_full_history:
        type: boolean
        description: >-
          Scan the entire git history even on a pull_request event. Off by default: PRs scan only their own commits. Non-PR events (schedule, push, workflow_dispatch) always scan the full history
          regardless of this input.
        required: false
        default: false
      run_trivy:
        type: boolean
        description: Run the Trivy dependency CVE-scan job.
        required: false
        default: true

concurrency:
  group: '${{ github.workflow }}-security-${{ github.event.pull_request.number || github.ref }}'
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GITLEAKS_VERSION: '8.30.1'

jobs:
  gitleaks:
    name: Secret Detection (Gitleaks)
    if: ${{ inputs.run_gitleaks }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # ratchet:actions/checkout@v6
        with:
          # Full history: needed to scan every commit on non-PR events, and on PRs to compute
          # the merge base between the base and head branches.
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks CLI
        env:
          VERSION: '${{ env.GITLEAKS_VERSION }}'
        run: |-
          set -euo pipefail
          tarball="gitleaks_${VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          curl -fsSL -o "${tarball}" "${base}/${tarball}"
          curl -fsSL -o checksums.txt "${base}/gitleaks_${VERSION}_checksums.txt"
          # Verify the download against the published checksum before trusting the binary.
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          ./gitleaks version

      - name: Resolve commit range to scan
        id: scan-range
        env:
          FULL_HISTORY: '${{ inputs.gitleaks_full_history }}'
          BASE_SHA: '${{ github.event.pull_request.base.sha }}'
          HEAD_SHA: '${{ github.event.pull_request.head.sha }}'
        run: |-
          set -euo pipefail

          # Empty log_opts means "scan everything" — the full-history default for any event
          # that is not a pull_request, and for PRs when the caller opts in explicitly.
          if [[ "${FULL_HISTORY}" == 'true' || -z "${BASE_SHA}" || -z "${HEAD_SHA}" ]]; then
            echo 'log_opts=' >>"${GITHUB_OUTPUT}"
            echo 'Scope: full git history.'
            exit 0
          fi

          # `base.sha` is the base branch as of the PR event and drifts once the base branch
          # advances, so diffing against it directly would re-scan unrelated commits. The
          # merge base is the true fork point — the range below is exactly the PR's commits,
          # and it stays correct across rebases and force-pushes.
          if ! merge_base="$(git merge-base "${BASE_SHA}" "${HEAD_SHA}" 2>/dev/null)"; then
            echo "::warning::Could not compute a merge base for ${BASE_SHA}...${HEAD_SHA}; falling back to a full-history scan."
            echo 'log_opts=' >>"${GITHUB_OUTPUT}"
            exit 0
          fi

          # --no-merges: a merge commit reintroduces its parents' blobs, which would report
          # the same secret once per merge that carries it forward.
          echo "log_opts=--no-merges ${merge_base}..${HEAD_SHA}" >>"${GITHUB_OUTPUT}"
          echo "Scope: $(git rev-list --count --no-merges "${merge_base}..${HEAD_SHA}") commit(s) in ${merge_base}..${HEAD_SHA}."

      - name: Scan git history for secrets
        env:
          EXIT_CODE: '${{ inputs.gitleaks_exit_code }}'
          LOG_OPTS: '${{ steps.scan-range.outputs.log_opts }}'
        run: |-
          set -euo pipefail

          args=(git . --redact --verbose --no-banner --exit-code "${EXIT_CODE}")
          # Only pass --log-opts when scoped: an empty value reaches `git log` as an empty
          # argument, which it rejects as an ambiguous revision.
          if [[ -n "${LOG_OPTS}" ]]; then
            args+=(--log-opts "${LOG_OPTS}")
          fi

          ./gitleaks "${args[@]}"

  trivy:
    name: Dependency CVE Scan (Trivy)
    if: ${{ inputs.run_trivy }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # ratchet:actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # ratchet:exclude (v0.36.0 — pinned by SHA; trivy-action has had compromised tags)
        env:
          # Trivy pulls its vulnerability DB from GHCR; the token avoids anonymous rate limits.
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN || github.token }}'
          TRIVY_NODE_VERSION: '${{ inputs.node_version }}'
        with:
          scan-type: fs
          scan-ref: '${{ inputs.scan_ref }}'
          format: table
          severity: '${{ inputs.severity }}'
          exit-code: '${{ inputs.trivy_exit_code }}'
          ignore-unfixed: true # Don't fail on CVEs that have no fixed version available yet.
